name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: restore-build-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall -q blender tests/python

      - name: Python lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m ruff check blender tests/python --select E9,F63,F7,F82

      - name: JSON schema validation
        run: |
          python -m pip install jsonschema
          python tests/python/test_schemas.py

      - name: Python unit tests
        run: python tests/python/test_manifest_io.py

      - name: Restore
        run: dotnet restore WuwaModelToBlender.slnx

      - name: Build
        run: dotnet build WuwaModelToBlender.slnx -c Release --no-restore

      - name: Test
        run: dotnet test WuwaModelToBlender.slnx -c Release --no-build --no-restore --verbosity minimal

      - name: Pack Windows CLI and add-on
        run: powershell -File tools/pack.ps1

      - name: Upload release zips
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/wuwa2blender-win-x64.zip
            dist/wuwa_model_tools.zip
          if-no-files-found: error
          retention-days: 14
